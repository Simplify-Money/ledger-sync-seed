plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

// Builds and runs on any JDK 17 or newer (17 and 21 both tested).
tasks.withType(JavaCompile).configureEach { options.release = 17 }

repositories { mavenCentral() }

dependencies {
    // The main source set compiles against the JDK alone. The H2 driver is
    // loaded reflectively by java.sql.DriverManager at run time, so it is a
    // runtime dependency only. Add whatever you need for your document store.
    runtimeOnly 'com.h2database:h2:2.2.224'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test { useJUnitPlatform() }

// Dependency-free smoke run. Works with no network and no database.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}
